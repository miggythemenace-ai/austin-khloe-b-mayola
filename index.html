<title>Tugtog Pilipinas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one phone-width column; five screens swap by hash; navy home, cream inner screens, gong-ring tiles as thumbnails. */
:root{--navy:#0f2a5f;--blue:#1b3f86;--sun:#f4b223;--cream:#fcf4de;--paper:#fffaf0;--ink:#1c2233;--muted:#5d6475;--earth:#9a5b2a;--jade:#2f7a6b;--line:#e6d9b8;--disp:Fraunces,Georgia,serif;--body:Nunito,system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font:400 16px/1.5 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.home{background:var(--navy);color:var(--cream)}
#app{max-width:480px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,9vw,2.6rem);font-weight:800;letter-spacing:.02em;color:var(--sun)}
h2{font-size:1.7rem;color:var(--navy);margin-bottom:6px}
h3{font-size:1.1rem;color:var(--navy)}
p{margin:0}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6vh}
.hero svg{width:104px;height:104px}
.hero p{color:#dfe5f3;max-width:34ch;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 22px;border:0;border-radius:999px;font:800 1rem var(--body);text-decoration:none;cursor:pointer}
.sun{background:var(--sun);color:var(--navy)}
.navy{background:var(--navy);color:var(--cream)}
.ghost{background:transparent;color:var(--navy);border:2px solid currentColor}
body.home .ghost{color:var(--cream)}
.sm{min-height:44px;padding:10px 18px}
:focus-visible{outline:3px solid var(--earth);outline-offset:3px}
body.home :focus-visible{outline-color:var(--sun)}
.top{margin-bottom:18px}
.top .btn{width:auto}
.sub{color:var(--muted);margin-bottom:18px}
.list{display:grid;gap:14px}
.card,.grp{display:grid;grid-template-columns:64px 1fr;gap:12px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;color:inherit;text-decoration:none}
.card>div,.grp>div{min-width:0}
.card .btn{grid-column:1/-1}
.meta,.grp span{color:var(--muted);font-size:.9rem}
.grp b{display:block;font:800 1.3rem var(--disp);color:var(--navy)}
.tile{width:64px;height:64px;border-radius:16px;background:radial-gradient(circle,var(--sun) 0 12%,transparent 13%),repeating-radial-gradient(circle,rgba(255,255,255,.2) 0 4px,transparent 4px 9px),var(--c)}
.tile.big{width:100%;height:auto;aspect-ratio:16/9;border-radius:22px;margin-bottom:16px}
dl{display:grid;gap:12px;margin:0 0 22px}
dt{font:800 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--earth)}
dd{margin:2px 0 0}
.acts{display:grid;gap:10px}
.note{margin-top:28px;font-size:.8rem;opacity:.75}
.auth{display:grid;gap:12px;padding-top:4vh}
.auth h2,.auth .sub{margin:0}
.auth .note{margin-top:4px}
.badge{width:88px;height:88px;border-radius:24px;background:var(--navy);display:grid;place-items:center}
.badge svg{width:68px;height:68px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:999px;background:var(--line)}
.tabs button{min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--navy);font:800 1rem var(--body);cursor:pointer}
.tabs .on{background:var(--navy);color:var(--cream)}
form{display:grid;gap:8px}
label{font:800 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--earth)}
input{width:100%;min-height:48px;padding:10px 16px;border:2px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);font:400 1rem var(--body)}
input:focus-visible{border-color:var(--navy)}
.err{min-height:1.5em;color:#a3261f;font-weight:700}
#splash{position:fixed;inset:0;z-index:50;overflow:hidden;touch-action:none;cursor:pointer}
.blank{position:absolute;inset:0;background:var(--cream)}
#splash.drain .blank{display:none}
.drop{position:absolute;left:calc(100% + 40px);top:var(--t);width:9px;height:9px;border-radius:50%;background:currentColor;opacity:0;animation:spray 1s ease-out infinite paused}
#splash.flood .drop,#splash.drain .drop{animation-play-state:running}
@keyframes spray{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.water{position:absolute;inset:0;transform:translateX(calc(-100% - 90px))}
.w0{background:#8fb8e8;color:#8fb8e8}
.w1{background:#2a5fb8;color:#2a5fb8}
.w2{background:var(--navy);color:var(--navy)}
.crest{position:absolute;top:0;left:calc(100% - 1px);width:90px;height:200%;fill:currentColor;animation:ride 1.7s linear infinite}
.w1 .crest{animation-duration:2.5s;animation-direction:reverse}
.w0 .crest{animation-duration:1.3s}
@keyframes ride{to{transform:translateY(-25%)}}
#splash.flood .water{transform:none;transition:transform 2s cubic-bezier(.2,.7,.25,1)}
#splash.flood .w1{transition-delay:.15s}
#splash.flood .w2{transition-delay:.3s}
#splash.drain .water{transition:transform 1.6s cubic-bezier(.55,0,.45,1)}
#splash.drain .w1{transition-delay:.15s}
#splash.drain .w0{transition-delay:.3s}
.splash-c{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;opacity:0;transform:scale(.92);transition:opacity .7s,transform .7s;pointer-events:none}
#splash.logo .splash-c{opacity:1;transform:none}
.splash-c svg{width:128px;height:128px}
.splash-c p{color:#dfe5f3;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:90vw;padding:10px 18px;border:2px solid var(--sun);border-radius:999px;background:var(--navy);color:var(--cream);font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#splash *{transition-duration:.01s!important;animation:none!important}}
</style>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="splash" role="button" tabindex="0" aria-label="Tugtog Pilipinas. Tap to continue">
<div class="blank"></div>
<div class="water w0"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="water w1"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="water w2"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="splash-c" id="sc"></div>
</div>
<script>
// ===== LOGIC START =====
const GROUPS=['Luzon','Visayas','Mindanao'];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const parse=h=>{h=h.replace('#','');const i=h.indexOf('-');return i<0?[h||'home','']:[h.slice(0,i),h.slice(i+1)]};
const toggle=(f,id)=>f.includes(id)?f.filter(x=>x!==id):[...f,id];
const inGroup=(d,g)=>d.filter(e=>e.g===g);
const regionsOf=(d,g)=>[...new Set(inGroup(d,g).map(e=>e.region))];
const cleanFavs=(raw,d)=>{try{const a=JSON.parse(raw);return Array.isArray(a)?a.filter(id=>d.some(e=>e.id===id)):[]}catch(e){return[]}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const validUser=u=>/^[A-Za-z0-9_]{3,20}$/.test(u);
const validPass=p=>typeof p==='string'&&p.length>=6;
const favKey=u=>'tugtog_favs_v1_'+u.toLowerCase();
const fbh=t=>{let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return'fb:'+h.toString(16)};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const hashPw=async(p,s,fb)=>{if(!fb)try{return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))}catch(e){}return fbh(s+p)};

// ===== DATA =====
// Row: [group, region, location, title, type, performer/community, instruments, background, significance, audio link, references]
// SAMPLE entries for layout testing. Replace with the verified Google Sheets rows (audio and references stay '' until verified).
const SAMPLE=true;
const D=[
['Luzon','Ilocos Region','Ilocos Norte','Pamulinawen','Folk song','Ilocano people','Voice, guitar','A traditional Ilocano song whose title refers to a hard-hearted person. Its composer is unknown and it is passed down by oral tradition.','Often sung as a signature song of Ilocano culture.'],
['Luzon','Cordillera (CAR)','Kankanaey communities, Cordillera','Salidummay','Folk song','Kankanaey people','Voice, guitar','A well-known Kankanaey song from the Cordillera highlands, sung in the Kankanaey language.','Helps keep the Kankanaey language and highland song tradition alive.'],
['Luzon','MIMAROPA','Lubang Island, Occidental Mindoro','Pandanggo sa Ilaw','Folk dance music','Mindoreño communities','Rondalla (bandurria, laud, guitar)','Music for a dance in which performers balance lit oil lamps on the head and hands. It comes from Lubang Island.','A showpiece of Philippine folk dance performed at festivals and school programs.'],
['Visayas','Western Visayas','Iloilo','Dandansoy','Folk song','Hiligaynon-speaking communities','Voice, guitar','A Hiligaynon folk song about parting from a loved one, shared by oral tradition.','One of the best-known songs from Panay Island.'],
['Visayas','Central Visayas','Cebu','Matud Nila','Folk song','Cebuano-speaking communities','Voice, guitar','A Cebuano song whose title means "they say". It is a staple of Cebuano singing.','A well-loved piece of the Cebuano song repertoire.'],
['Visayas','Central Visayas','Cebu City','Sinulog Drumbeat','Festival drum rhythm','Cebuano devotees and dance troupes','Drums','Drumming that drives the Sinulog dance, performed in honor of the Santo Niño. The festival is held every January in Cebu City.','Links Cebuano devotion to the Santo Niño with community dance and music.'],
['Mindanao','Bangsamoro','Lanao del Sur and Maguindanao','Kulintang Ensemble','Gong ensemble','Maranao and Maguindanaon musicians','Kulintang, agong, gandingan, babandir, dabakan','An ensemble centered on the kulintang, a row of small horizontal gongs, played with larger gongs and a drum.','Played at weddings, celebrations and community gatherings.'],
['Mindanao','Bangsamoro','Sulu Archipelago','Pangalay','Dance music','Tausug and Sama communities','Kulintangan, gabbang, gongs','Music for a dance known for graceful arm and hand movements, often with long nail extensions.','A signature dance tradition of the Sulu Sea communities, performed at weddings and celebrations.'],
['Mindanao','SOCCSKSARGEN','Lake Sebu, South Cotabato','Hegalong','String instrumental','T\'boli people','Hegalong (two-stringed boat lute)','Music played on the hegalong, a boat-shaped lute with two strings.','A key instrument of T\'boli musical heritage.']
].map(r=>({id:slug(r[3]),g:r[0],region:r[1],place:r[2],title:r[3],type:r[4],who:r[5],inst:r[6],bg:r[7],sig:r[8],audio:r[9]||'',ref:r[10]||''}));
// ===== LOGIC END =====

// ===== STATE + STORAGE =====
const $=document.getElementById('app'),find=id=>D.find(e=>e.id===id),USERS='tugtog_users_v1',SES='tugtog_session_v1';
const mem={},st={get:k=>{try{const v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}},set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
let favs=[],user='',mode='in',msg='',draftU='',cur=location.hash.slice(1)||'home',prev='home',tm;
const getUsers=()=>{try{const u=JSON.parse(st.get(USERS)||'{}');return u&&typeof u==='object'?u:{}}catch(e){return{}}};
function loadFavs(){let r=st.get(favKey(user))||'';
 if(!r)try{const o=JSON.parse(window.AppInventor.getWebViewString());if(o&&String(o.user).toLowerCase()===user.toLowerCase())r=JSON.stringify(o.favs)}catch(e){}
 return cleanFavs(r,D)}
function save(){st.set(favKey(user),JSON.stringify(favs));try{window.AppInventor.setWebViewString(JSON.stringify({user,favs}))}catch(e){}}
function toast(t){const n=document.getElementById('toast');n.textContent=t;n.className='on';clearTimeout(tm);tm=setTimeout(()=>n.className='',1800)}

// ===== SCREENS =====
const col={Luzon:'var(--blue)',Visayas:'var(--jade)',Mindanao:'var(--earth)'};
const tile=(e,big)=>`<div class="tile${big?' big':''}" style="--c:${col[e.g]}"></div>`;
const back=(h,t)=>`<div class="top"><a class="btn navy sm" href="${h}">&larr; ${t||'Back'}</a></div>`;
const logo=()=>{let r='';for(let i=0;i<8;i++)r+=`<line x1="50" y1="6" x2="50" y2="19" transform="rotate(${i*45} 50 50)"/>`;
 return `<svg viewBox="0 0 100 100" role="img" aria-label="Tugtog Pilipinas logo"><g style="stroke:var(--sun);stroke-width:5;stroke-linecap:round">${r}</g><circle cx="50" cy="50" r="27" style="fill:var(--sun)"/><g style="fill:var(--navy);stroke:var(--navy);stroke-width:3.5;stroke-linecap:round"><ellipse cx="44" cy="60" rx="7" ry="5" stroke="none"/><path d="M50 59V38q9 2 9 12" fill="none"/></g></svg>`};
const card=(e,rm)=>`<article class="card">${tile(e)}<div><h3>${esc(e.title)}</h3><p class="meta">${esc(e.region)} &middot; ${esc(e.type)}</p></div><a class="btn navy sm" href="#detail-${e.id}">View Details</a>${rm?`<button class="btn ghost sm" data-fav="${e.id}">Remove from Favorites</button>`:''}</article>`;
const home=()=>`<section class="hero">${logo()}<h1>TUGTOG<br>PILIPINAS</h1><p>Explore the music of the Philippines, region by region. Meet the songs, the instruments and the communities behind them.</p><a class="btn sun" href="#regions">Explore Music</a><a class="btn ghost" href="#favs">Favorites (${favs.length})</a><button class="btn ghost sm" data-out>Log out (${esc(user)})</button></section>`;
const login=()=>{const up=mode==='up';return `<section class="auth"><div class="badge">${logo()}</div><h2>${up?'Create your account':'Welcome back'}</h2><p class="sub">${up?'Sign up to save your favorite music.':'Log in to see your saved music.'}</p><div class="tabs"><button type="button" class="${up?'':'on'}" aria-pressed="${!up}" data-mode="in">Log in</button><button type="button" class="${up?'on':''}" aria-pressed="${up}" data-mode="up">Sign up</button></div><form id="af" novalidate><label for="u">Username</label><input id="u" name="u" value="${esc(draftU)}" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"><label for="p">Password</label><input id="p" name="p" type="password" autocomplete="${up?'new-password':'current-password'}">${up?'<label for="p2">Confirm password</label><input id="p2" name="p2" type="password" autocomplete="new-password">':''}<p class="err" id="err" role="alert">${esc(msg)}</p><button class="btn sun" type="submit">${up?'Create account':'Log in'}</button></form><p class="note">Accounts are saved on this device only.</p></section>`};
const regions=()=>back('#home')+`<h2>Choose a Region</h2><p class="sub">Pick an island group.</p><div class="list">`+GROUPS.map(g=>`<a class="grp" href="#list-${g}">${tile({g})}<div><b>${g}</b><span>${inGroup(D,g).length} entries &middot; ${esc(regionsOf(D,g).join(', '))}</span></div></a>`).join('')+`</div>`;
const list=g=>back('#regions')+`<h2>${g}</h2><p class="sub">${esc(regionsOf(D,g).join(', '))}</p><div class="list">`+inGroup(D,g).map(e=>card(e)).join('')+`</div>`;
const detail=e=>{const f=favs.includes(e.id),row=(k,v)=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`;
 return back(prev.startsWith('favs')?'#favs':'#list-'+e.g)+tile(e,1)+`<h2>${esc(e.title)}</h2><p class="sub">${esc(e.place)}</p><dl>${row('Region',e.region)+row('Music type',e.type)+row('Performer or community',e.who)+row('Instruments',e.inst)+row('Background and origin',e.bg)+row('Cultural significance',e.sig)+row('References',e.ref||'To be added by the research team')}</dl><div class="acts"><button class="btn sun" data-play="${e.id}">Listen</button><button class="btn ${f?'ghost':'navy'}" data-fav="${e.id}">${f?'Remove from Favorites':'Save to Favorites'}</button></div>`};
const favScreen=()=>{const l=favs.map(find).filter(Boolean);
 return back('#home','Back to Home')+`<h2>My Favorites</h2>`+(l.length?`<p class="sub">${l.length} saved</p><div class="list">${l.map(e=>card(e,1)).join('')}</div>`:`<p class="sub">Nothing saved yet. Open a song and tap Save to Favorites.</p><a class="btn sun" href="#regions">Explore Music</a>`)};

// ===== ROUTER =====
function render(keep){const[v,a]=parse(location.hash);let h,hm=0;
 if(!user)h=login();else if(v==='regions')h=regions();else if(v==='list'&&GROUPS.includes(a))h=list(a);else if(v==='detail'&&find(a))h=detail(find(a));else if(v==='favs')h=favScreen();else{h=home();hm=1}
 document.body.className=hm?'home':'';
 $.innerHTML=h+(SAMPLE&&user?'<p class="note">Sample entries for layout testing. Replace with the verified research data.</p>':'');
 if(!keep)window.scrollTo(0,0)}
addEventListener('hashchange',()=>{prev=cur;cur=location.hash.slice(1)||'home';render()});
$.addEventListener('click',ev=>{const b=ev.target.closest('[data-fav],[data-play],[data-out],[data-mode]');if(!b)return;
 if(b.dataset.mode){const f=document.getElementById('u');draftU=f?f.value:'';mode=b.dataset.mode;msg='';return render(1)}
 if('out' in b.dataset){user='';favs=[];mode='in';msg='';st.set(SES,'');return render()}
 if(b.dataset.fav){const id=b.dataset.fav,had=favs.includes(id);favs=toggle(favs,id);save();toast(had?'Removed from Favorites':'Saved to Favorites');render(1)}
 else{const e=find(b.dataset.play);if(e&&e.audio){window.open(e.audio,'_blank')||(location.href=e.audio)}else toast('Audio link coming soon')}});
// ===== AUTH (accounts live on this device) =====
const rnd=()=>{try{return hex(crypto.getRandomValues(new Uint8Array(8)))}catch(e){return Math.random().toString(16).slice(2)}};
const setErr=t=>{msg=t;document.getElementById('err').textContent=t};
function enter(u){user=u;st.set(SES,u);favs=loadFavs();mode='in';msg='';draftU='';location.hash='#home';render()}
$.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,u=f.u.value.trim(),p=f.p.value,users=getUsers(),k=u.toLowerCase();draftU=u;
 if(mode==='up'){
  if(!validUser(u))return setErr('Username needs 3 to 20 letters, numbers or _.');
  if(!validPass(p))return setErr('Password needs at least 6 characters.');
  if(p!==f.p2.value)return setErr('Passwords do not match.');
  if(users[k])return setErr('That username is taken. Try logging in.');
  const s=rnd();users[k]={name:u,salt:s,hash:await hashPw(p,s)};st.set(USERS,JSON.stringify(users));enter(u)}
 else{const a=users[k];
  if(!a||a.hash!==await hashPw(p,a.salt,a.hash.indexOf('fb:')===0))return setErr('Username or password is wrong.');
  enter(a.name)}});

// ===== SPLASH: wave rises, floods, logo shows; tap or wait to drain =====
(function(){const sp=document.getElementById('splash'),f=matchMedia('(prefers-reduced-motion:reduce)').matches?.3:1;let stage=0;
 document.getElementById('sc').innerHTML=logo()+'<h1>TUGTOG<br>PILIPINAS</h1><p>Tap to continue</p>';
 const drain=()=>{if(stage!==2)return;stage=3;sp.className='drain';setTimeout(()=>{sp.hidden=true},2100*f)};
 sp.addEventListener('click',drain);
 sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drain()}});
 ['w0','w1','w2'].forEach(c=>{let h='';for(let i=0;i<10;i++)h+=`<i class="drop" style="--t:${(Math.random()*96).toFixed(0)}%;--dx:${(30+Math.random()*80).toFixed(0)}px;--dy:${(-70+Math.random()*60).toFixed(0)}px;animation-delay:${(Math.random()*1).toFixed(2)}s"></i>`;sp.querySelector('.'+c).insertAdjacentHTML('beforeend',h)});
 setTimeout(()=>{sp.className='flood';stage=1},600*f);
 setTimeout(()=>{sp.className='flood logo';stage=2},2700*f);
 setTimeout(drain,5800*f)})();

user=st.get(SES)||'';if(user&&!getUsers()[user.toLowerCase()])user='';
favs=user?loadFavs():[];render();
</script>
