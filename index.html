<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tugtog Pilipinas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--navy:#0f2a5f;--sun:#f4b223;--cream:#fcf4de;--red:#ce1126;--blue2:#2f6bff;--disp:"Playfair Display",Georgia,serif;--body:Nunito,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{background:transparent}
body{margin:0;font:400 16px/1.5 var(--body)}
h1{margin:0;font-family:var(--disp);font-size:clamp(2rem,9vw,2.6rem);font-weight:900;letter-spacing:.02em;line-height:1.1;text-wrap:balance;color:#fff}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

#splash{position:fixed;inset:0;z-index:50;overflow:hidden;touch-action:none}
.blank{position:absolute;inset:0;background:transparent}
#splash.drain .blank{display:none}
.drop{position:absolute;left:calc(100% + 40px);top:var(--t);width:9px;height:9px;border-radius:50%;background:currentColor;opacity:0;animation:spray 1s ease-out infinite paused}
#splash.flood .drop,#splash.drain .drop{animation-play-state:running}
@keyframes spray{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.water{position:absolute;inset:0;transform:translateX(calc(-100% - 90px))}
.w0{background:#8fb8e8;color:#8fb8e8}
.w1{background:#2a5fb8;color:#2a5fb8}
.w2{background:var(--navy);color:var(--navy)}
.crest{position:absolute;top:0;left:calc(100% - 1px);width:90px;height:200%;fill:currentColor;animation:ride 1.7s linear infinite}
.w1 .crest{animation-duration:2.5s;animation-direction:reverse}
.w0 .crest{animation-duration:1.3s}
@keyframes ride{to{transform:translateY(-25%)}}
#splash.flood .water{transform:none;transition:transform 1.3s cubic-bezier(.2,.7,.25,1)}
#splash.flood .w1{transition-delay:.1s}
#splash.flood .w2{transition-delay:.2s}
#splash.drain .water{transition:transform 1.3s cubic-bezier(.55,0,.45,1)}
#splash.drain .w1{transition-delay:.1s}
#splash.drain .w0{transition-delay:.2s}
.splash-c{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;opacity:0;transform:scale(.92);transition:opacity .7s,transform .7s;pointer-events:none}
#splash.logo .splash-c{opacity:1;transform:none}
.splash-c svg{width:128px;height:128px}
.splash-c p{color:#dfe5f3;font-size:.9rem}
/* tagline from the poster */
.splash-c p{font:700 1.05rem/1.35 var(--disp);color:#fff}
@media (prefers-reduced-motion:reduce){#splash *{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>

<div id="splash" role="img" aria-label="Tugtog Pilipinas">
<div class="blank"></div>
<div class="water w0"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="water w1"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="water w2"><svg class="crest" viewBox="0 0 60 2400" preserveAspectRatio="none"><path d="M0 0H30Q60 150 30 300T30 600T30 900T30 1200T30 1500T30 1800T30 2100T30 2400H0Z"/></svg></div>
<div class="splash-c" id="sc"></div>
</div>

<script>
// Sun emblem: 8 groups of rays (red left, blue right) around a play button.
const logo=()=>{const P=(r,t)=>(50+r*Math.sin(t)).toFixed(1)+' '+(50-r*Math.cos(t)).toFixed(1);
 const ray=(a,len,w)=>{const t=a*Math.PI/180;return `M${P(29,t-w)}L${P(len,t)}L${P(29,t+w)}Z`};
 let red='',blue='';for(let i=0;i<8;i++){const a=i*45,d=ray(a,48,.1)+ray(a-12,41,.065)+ray(a+12,41,.065);if(a>=225||a===0)red+=d;else blue+=d}
 return `<svg viewBox="0 0 100 100" role="img" aria-label="Tugtog Pilipinas logo"><path d="${red}" style="fill:var(--red)"/><path d="${blue}" style="fill:var(--blue2)"/><circle cx="50" cy="50" r="27" style="fill:#0b1346;stroke:var(--sun);stroke-width:2.5"/><path d="M43 37.5V62.5L65 50Z" style="fill:var(--cream);stroke:var(--cream);stroke-width:4;stroke-linejoin:round"/></svg>`};

// SPLASH: 5s total. Waves enter (1.5s), stay (2s), exit (1.5s). Not clickable.
(function(){const sp=document.getElementById('splash'),ENTER=1500,HOLD=2000,EXIT=1500;
 document.getElementById('sc').innerHTML=logo()+'<h1>TUGTOG<br>PILIPINAS</h1><p>Discover the Music.<br>Explore the Culture.</p>';
 const drain=()=>{sp.className='drain';setTimeout(()=>{sp.hidden=true;try{window.AppInventor.setWebViewString('splash-done')}catch(e){}},EXIT)};
 ['w0','w1','w2'].forEach(c=>{let h='';for(let i=0;i<10;i++)h+=`<i class="drop" style="--t:${(Math.random()*96).toFixed(0)}%;--dx:${(30+Math.random()*80).toFixed(0)}px;--dy:${(-70+Math.random()*60).toFixed(0)}px;animation-delay:${(Math.random()*1).toFixed(2)}s"></i>`;sp.querySelector('.'+c).insertAdjacentHTML('beforeend',h)});
 setTimeout(()=>{sp.className='flood'},30);
 setTimeout(()=>{sp.className='flood logo'},800);
 // enter ends ~1530ms (1.3s slide + 0.2s stagger); stay HOLD; exit takes EXIT
 setTimeout(drain,ENTER+HOLD)})();
</script>
</body>
</html>
